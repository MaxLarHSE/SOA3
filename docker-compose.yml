version: "3.8"

services:
  flight-db:
    image: postgres:15-alpine
    container_name: flight-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: flights
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d flights"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-db:
    image: postgres:15-alpine
    container_name: booking-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: bookings
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d bookings"]
      interval: 5s
      timeout: 5s
      retries: 10

  flight-flyway:
    image: flyway/flyway:9-alpine
    container_name: flight-flyway
    depends_on:
      flight-db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://flight-db:5432/flights
      -user=myuser
      -password=mypassword
      migrate
    volumes:
      - ./flight-service/migrations:/flyway/sql

  booking-flyway:
    image: flyway/flyway:9-alpine
    container_name: booking-flyway
    depends_on:
      booking-db:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://booking-db:5432/bookings
      -user=myuser
      -password=mypassword
      migrate
    volumes:
      - ./booking-service/migrations:/flyway/sql

  flight-service:
    build:
      context: .
      dockerfile: ./flight-service/Dockerfile
    container_name: flight-service
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: "postgres://myuser:mypassword@flight-db:5432/flights?sslmode=disable"
      GRPC_PORT: "50051"
      FLIGHT_SERVICE_API_KEY: "super-secret-key"
    depends_on:
      flight-flyway:
        condition: service_completed_successfully

  booking-service:
    build:
      context: .
      dockerfile: ./booking-service/Dockerfile
    container_name: booking-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://myuser:mypassword@booking-db:5432/bookings?sslmode=disable"
      HTTP_PORT: "8080"
      FLIGHT_SERVICE_ADDR: "flight-service:50051"
      FLIGHT_SERVICE_API_KEY: "super-secret-key"
    depends_on:
      booking-flyway:
        condition: service_completed_successfully
      flight-service:
        condition: service_started